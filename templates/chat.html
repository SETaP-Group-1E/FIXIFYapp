{% extends "layout.html" %}

{% block content %}
<!-- Include the Socket.IO library specifically for this page -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

<div id="Messagebox">
    <div id="messages"></div>
    <div class="controls">
        <input type="text" id="tempmessage" placeholder="Write a message" autocomplete="off">
        <button id="sendBtn">Send</button>
    </div>
</div>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", () => {
        const socket = io();
        
        socket.on('message', function(msg) {
            const p = document.createElement('p'); 
            p.classList.add('message'); 
            p.innerHTML = `<strong>User:</strong> ${msg}`; 
            document.getElementById('messages').appendChild(p); 
            
            const messagesDiv = document.getElementById('messages'); 
            messagesDiv.scrollTop = messagesDiv.scrollHeight; 
        });

        document.getElementById('sendBtn').addEventListener('click', () => { 
            const messageInput = document.getElementById('tempmessage'); 
            if (messageInput.value.trim() !== "") { 
                socket.send(messageInput.value); 
                messageInput.value = ''; 
            } 
        }); 

        document.getElementById('tempmessage').addEventListener('keypress', function (e) { 
            if (e.key === 'Enter') { 
                document.getElementById('sendBtn').click(); 
            } 
        }); 
    }); 
</script>
{% endblock %}
